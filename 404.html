  <style>
    :root { --gold: #D3AF37; --champagne: #CDBD88; }

      letter-spacing: 0.1em;
      color: var(--gold);
      font-size: 1.1rem;
      margin: 0 0 0.5rem;
    }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 1rem; }
    p { color: rgba(255,255,255,0.75); max-width: 42ch; margin: 0 auto 2rem; line-height: 1.6; }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.85rem 1.6rem;
      border-radius: 4px;
    }
    a.btn:hover { background: var(--champagne); }
